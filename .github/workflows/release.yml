name: Release bauen

# Erscheint automatisch, wenn ein Versions-Tag gepusht wird:
#   git tag v1.0.0 && git push origin v1.0.0
# Ergebnis: GitHub-Release mit Windows-EXE und zwei macOS-ZIPs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tkinter vorhanden?
        run: python -c "import tkinter; print('tkinter ok')"
      - name: PyInstaller bereitstellen (build.cmd installiert ihn sonst selbst)
        run: python -m pip install --upgrade pyinstaller
      - name: bauen – nutzt das normale windows/build.cmd
        run: cmd /c windows\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Miezi-windows
          path: windows/Miezi.exe

  macos-arm64:
    name: macOS – Apple Silicon
    runs-on: macos-14        # ARM-Runner; Runner-Namen ggfs. pflegen, falls GitHub sie weiterreicht
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tkinter vorhanden?
        run: python -c "import tkinter; print('tkinter ok')"
      - name: Abhängigkeiten (Quartz/Cocoa für die App, PyInstaller für den Bau)
        run: python -m pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa pyinstaller
      - name: bauen – nutzt das normale macos/build.sh
        run: bash macos/build.sh
      - name: ZIP (ditto erhält Symlinks und Rechte der .app)
        run: cd macos/dist && ditto -c -k --sequesterRsrc --keepParent Miezi.app Miezi-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Miezi-macos-arm64
          path: macos/dist/Miezi-macOS-arm64.zip

  macos-x86_64:
    name: macOS – Intel
    runs-on: macos-13        # letzter Intel-Runner-Zweig; fällt er weg, diesen Job entfernen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tkinter vorhanden?
        run: python -c "import tkinter; print('tkinter ok')"
      - name: Abhängigkeiten
        run: python -m pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa pyinstaller
      - name: bauen – nutzt das normale macos/build.sh
        run: bash macos/build.sh
      - name: ZIP
        run: cd macos/dist && ditto -c -k --sequesterRsrc --keepParent Miezi.app Miezi-macOS-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Miezi-macos-x86_64
          path: macos/dist/Miezi-macOS-x86_64.zip

  release:
    name: Release mit Anhängen
    needs: [windows, macos-arm64, macos-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body: |
            ## Installation
            - **Windows:** `Miezi.exe` herunterladen und starten. Beim ersten Mal
              warnt SmartScreen (die EXE ist unsigniert) → **„Weitere
              Informationen“ → „Trotzdem ausführen“**.
            - **macOS:** ZIP entpacken und `Miezi.app` **einmalig per
              Rechtsklick → Öffnen** starten (Gatekeeper, unsigniert).
              `arm64` = Apple Silicon, `x86_64` = Intel-Macs.
            Einstellungen und Fehlerprotokoll: `%APPDATA%\Miezi\` bzw.
            `~/Library/Application Support/Miezi/`.
